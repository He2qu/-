<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hi, Creator · 静谧书房</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* 默认：石墨深色护眼 (Graphite Dark) */
    :root {
      --bg-deep: #111113;
      --bg-main: #161618;
      --bg-elevated: #1f1f23;
      --bg-hover: #28282d;
      --bubble-user: #2a2a30;
      --bubble-ai: #1c1c20;
      --border-subtle: #2c2c32;
      --border-strong: #46464f;
      --text-primary: #dcdce0;
      --text-dialogue: #f2f2f5;
      --text-secondary: #9898a2;
      --text-muted: #666670;
      --accent: #e4e4e8;
      --accent-contrast: #121214;
      --tag-bg: #242429;
      --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.35);
      --overlay-bg: rgba(8, 8, 10, 0.68);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 可切换：水墨纸张浅色护眼 (E-Ink Paper) */
    [data-theme="light"] {
      --bg-deep: #e4e4df;
      --bg-main: #efefeb;
      --bg-elevated: #e6e6e1;
      --bg-hover: #dadad4;
      --bubble-user: #dcdcd6;
      --bubble-ai: #fafaf7;
      --border-subtle: #d0d0c8;
      --border-strong: #a2a29a;
      --text-primary: #242427;
      --text-dialogue: #111113;
      --text-secondary: #5a5a62;
      --text-muted: #86868e;
      --accent: #222225;
      --accent-contrast: #f4f4f0;
      --tag-bg: #dfdfd9;
      --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.05);
      --overlay-bg: rgba(25, 25, 28, 0.45);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--custom-font, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif);
      font-size: var(--base-font-size, 15px);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }

    #app {
      display: flex;
      height: 100%;
      height: 100dvh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      background: var(--bg-main);
    }

    /* 侧边栏遮罩（手机端专用） */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(2px);
      z-index: 35;
      display: none;
    }
    .sidebar-backdrop.open { display: block; }

    /* 左侧会话抽屉 */
    .sidebar {
      width: 276px;
      max-width: 82vw;
      height: 100%;
      background: var(--bg-deep);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 40;
      flex-shrink: 0;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(0);
        box-shadow: var(--shadow-soft);
      }
      .sidebar.closed {
        transform: translateX(-105%);
      }
    }
    @media (min-width: 769px) {
      .sidebar.closed {
        width: 0;
        overflow: hidden;
        border-right: none;
      }
    }

    .brand {
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      font-size: 1em;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-primary);
    }
    .new-chat-btn {
      margin: 12px 12px 6px;
      padding: 11px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9em;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 500;
    }
    .new-chat-btn:active { background: var(--bg-hover); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .session-item {
      padding: 11px 12px;
      border-radius: 9px;
      margin-bottom: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-secondary);
      border: 1px solid transparent;
    }
    .session-item.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }
    .session-info {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      padding-right: 8px;
    }
    .session-name {
      font-size: 0.92em;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-time {
      font-size: 0.74em;
      color: var(--text-muted);
    }
    .session-actions {
      display: flex;
      gap: 4px;
    }
    .session-actions button {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.8em;
      padding: 4px 7px;
      border-radius: 6px;
    }

    /* 主界面区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
    }

    /* 顶部导航栏：针对 iPhone 13 390px 宽度专门优化 */
    .header {
      padding-top: var(--safe-top);
      min-height: calc(52px + var(--safe-top));
      padding-left: 10px;
      padding-right: 10px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-main);
      z-index: 10;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
    }
    .icon-btn:active {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .icon-btn.highlight {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .badge-num {
      font-size: 0.78em;
      padding: 0 4px;
      border-radius: 4px;
      background: var(--bg-hover);
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .model-select {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      height: 34px;
      padding: 0 7px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8em;
      outline: none;
      max-width: 132px;
      text-overflow: ellipsis;
    }

    /* 消息列表：iPhone 13 黄金阅读间距 + 左右气泡 */
    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    @media (min-width: 769px) {
      .messages { padding: 24px 15%; }
      .model-select { max-width: 200px; }
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      position: relative;
    }
    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    /* 消息顶部元信息栏 */
    .msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      padding: 0 2px;
      font-size: 0.74em;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .msg-row.user .msg-header {
      flex-direction: row-reverse;
    }
    .msg-floor {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .msg-sender {
      font-weight: 600;
      color: var(--text-secondary);
    }
    .lore-hit-badge {
      font-size: 0.92em;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--tag-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    /* 左右对话气泡 */
    .bubble {
      padding: 11px 14px;
      border-radius: 14px;
      line-height: var(--reading-line-height, 1.6);
      word-break: break-word;
      font-size: 0.96em;
      letter-spacing: 0.02em;
      text-align: justify;
    }
    .msg-row.assistant { max-width: 97%; }
    body.indent-on .msg-row.assistant .bubble p { text-indent: 2em; }
    .msg-row.assistant .bubble { padding: 14px 16px; }
    .scene-header {
      font-size: 0.8em;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      padding-bottom: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
    }
    .msg-row.user .bubble {
      background: var(--bubble-user);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-right-radius: 4px;
    }
    .msg-row.assistant .bubble {
      background: var(--bubble-ai);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-soft);
    }

    /* 角色扮演排版美化：动作斜体、台词高亮 */
    .bubble p { margin-bottom: var(--reading-para-gap, 0.65em); }
    .bubble p:last-child { margin-bottom: 0; }
    .rp-action {
      color: var(--text-secondary);
      font-style: italic;
    }
    .rp-quote {
      color: var(--text-dialogue);
      font-weight: 450;
    }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--bg-deep);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.86em;
      border: 1px solid var(--border-subtle);
    }
    .bubble pre {
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      padding: 9px 11px;
      border-radius: 7px;
      overflow-x: auto;
      margin: 6px 0;
      font-size: 0.84em;
    }
    .bubble hr {
      border: none;
      border-top: 1px solid var(--border-subtle);
      margin: 8px 0;
    }

    /* 手机触控友好的底部消息操作栏（常驻轻量化展示，无需鼠标悬停） */
    .msg-footer {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .msg-row.user .msg-footer {
      flex-direction: row-reverse;
    }
    .swipe-nav {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 5px;
      font-size: 0.74em;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .swipe-nav button {
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      padding: 0 5px;
      font-size: 1.05em;
    }
    .swipe-nav button:disabled { opacity: 0.28; }

    .msg-tools {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .tool-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.72em;
      padding: 3px 7px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .tool-btn:active {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* 行内编辑框（字号16px防止iOS自动放大） */
    .inline-edit-box {
      width: 100%;
      min-width: 260px;
      margin-top: 4px;
    }
    .inline-edit-textarea {
      width: 100%;
      background: var(--bg-deep);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      border-radius: 9px;
      padding: 10px;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.55;
      resize: vertical;
      outline: none;
    }
    .inline-edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 6px;
    }

    /* 思考过程折叠框 */
    .reasoning-box {
      margin-bottom: 5px;
      width: 100%;
    }
    .reasoning-toggle {
      background: var(--bg-elevated);
      border: 1px dashed var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.74em;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    .reasoning-content {
      margin-top: 4px;
      padding: 8px 11px;
      background: var(--bg-deep);
      border-left: 2px solid var(--border-strong);
      border-radius: 5px;
      font-size: 0.82em;
      color: var(--text-secondary);
      line-height: 1.55;
      white-space: pre-wrap;
      display: none;
    }
    .reasoning-content.open { display: block; }

    /* 底部输入区：适配 iPhone Home 横条 + 16px 防缩放 */
    .input-area {
      padding: 8px 10px calc(10px + var(--safe-bottom));
      background: var(--bg-main);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    @media (min-width: 769px) {
      .input-area { padding: 10px 15% 18px; border-top: none; }
    }
    .input-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 7px 9px;
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }
    .input-box:focus-within {
      border-color: var(--border-strong);
    }
    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px; /* 关键：iOS Safari >=16px 不会触发页面自动放大 */
      line-height: 1.45;
      resize: none;
      max-height: 115px;
      min-height: 24px;
      padding: 2px 0;
    }
    .chat-textarea::placeholder {
      color: var(--text-muted);
      font-size: 0.88em;
    }
    .send-btn {
      background: var(--accent);
      color: var(--accent-contrast);
      border: none;
      border-radius: 8px;
      height: 34px;
      padding: 0 13px;
      font-weight: 600;
      font-size: 0.86em;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn:disabled { opacity: 0.35; }

    /* 手机端 Bottom Sheet 抽屉与弹窗 */
    .overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(3px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }

    .drawer, .modal {
      width: 100%;
      max-width: 600px;
      height: 88dvh;
      max-height: 88dvh;
      background: var(--bg-deep);
      border-top: 1px solid var(--border-strong);
      border-radius: 18px 18px 0 0;
      display: flex;
      flex-direction: column;
      padding: 14px 15px calc(16px + var(--safe-bottom));
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .sheet-pill {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-strong);
      margin: 0 auto 10px;
      flex-shrink: 0;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .panel-title {
      color: var(--text-primary);
      font-size: 0.96em;
      font-weight: 600;
    }
    .field { margin-bottom: 11px; }
    .field label {
      display: block;
      font-size: 0.78em;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .text-input, .select-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 9px 11px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px; /* 防 iPhone 缩放 */
      outline: none;
    }
    .text-input:focus, .select-input:focus {
      border-color: var(--border-strong);
    }
    .section-card {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 0.85em;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 手机端自适应双列/单列网格 */
    .form-grid-2, .form-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 420px) {
      .form-grid-3 { grid-template-columns: 1fr; }
    }

    /* 世界书列表与卡片 */
    .lore-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .lore-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 10px 12px;
    }
    .lore-card.disabled { opacity: 0.48; }
    .lore-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .lore-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 0.88em;
      color: var(--text-primary);
      flex-wrap: wrap;
    }
    .lore-badge {
      font-size: 0.72em;
      font-weight: normal;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--bg-deep);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .lore-keys {
      font-size: 0.75em;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .lore-content {
      font-size: 0.84em;
      color: var(--text-secondary);
      line-height: 1.52;
      white-space: pre-wrap;
    }

    /* 时间线样式 */
    .timeline-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 8px;
      padding-left: 12px;
      border-left: 1px solid var(--border-strong);
    }
    .timeline-node {
      position: relative;
      margin-bottom: 15px;
      padding-left: 12px;
    }
    .timeline-node::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-primary);
    }
    .timeline-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.74em;
      color: var(--text-muted);
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .timeline-tag {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .timeline-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.86em;
      line-height: 1.58;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

</head>
<body>
  <div id="app">
    <!-- 手机端侧栏半透明遮罩 -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 左侧会话抽屉（手机端默认收起） -->
    <aside id="sidebar" class="sidebar closed">
      <div class="brand">
        <div class="brand-title">
          <span class="status-dot"></span>
          <span id="brandTitleText">Hi, Creator</span>
        </div>
        <button class="icon-btn" id="btnCloseSidebarMobile" style="height: 28px; padding: 0 8px;">✕</button>
      </div>
      <button class="new-chat-btn" id="btnNewSession">
        <span>＋ 开启新的夜谈</span>
        <span style="font-size: 0.78em; color: var(--text-muted);">New</span>
      </button>
      <div class="session-list" id="sessionList"></div>
    </aside>

    <!-- 主界面 -->
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="icon-btn" id="btnToggleSidebar" title="会话列表">☰</button>
          <select class="model-select" id="modelSelect">
            <option value="claude-3-7-sonnet-20250219">Claude 3.7</option>
            <option value="claude-3-5-sonnet-20241022">Claude 3.5</option>
            <option value="deepseek-chat">DeepSeek V3</option>
            <option value="deepseek-reasoner">DeepSeek R1</option>
            <option value="gpt-4o">GPT-4o</option>
          </select>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="btnToggleTheme" title="切换深浅护眼色">◐</button>
          <button class="icon-btn highlight" id="btnOpenLorebook">
            ◈ 世界书 <span class="badge-num" id="loreCount">0</span>
          </button>
          <button class="icon-btn" id="btnOpenTimeline">
            ◎ 记忆 <span class="badge-num" id="memoryCount">0</span>
          </button>
          <button class="icon-btn" id="btnOpenSettings" title="设置">⚙</button>
        </div>
      </header>

      <section class="messages" id="messageList"></section>

      <footer class="input-area">
        <div class="input-box">
          <button class="icon-btn" id="btnQuickReroll" title="重Roll最后一条回复" style="height: 34px; padding: 0 10px;">↻</button>
          <textarea
            id="chatInput"
            class="chat-textarea"
            rows="1"
            placeholder="写下成柏青的行动、台词或心理..."
          ></textarea>
          <button class="send-btn" id="btnSend">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- 底部抽屉 1：世界书 (Lorebook) -->
  <div class="overlay" id="lorebookOverlay">
    <div class="drawer">
      <div class="sheet-pill"></div>
      <div class="panel-header">
        <span class="panel-title">◈ 世界书设定集 (Lorebook)</span>
        <div style="display: flex; gap: 5px;">
          <button class="icon-btn" id="btnExportLore" style="height: 30px;">导出</button>
          <label class="icon-btn" style="cursor: pointer; height: 30px;">
            导入
            <input type="file" id="importLoreInput" accept=".json" style="display: none;" />
          </label>
          <button class="icon-btn" id="btnCloseLorebook" style="height: 30px;">关闭</button>
        </div>
      </div>

      <input
        type="text"
        id="loreSearch"
        class="text-input"
        placeholder="搜索词条名称、触发词或设定内容..."
        style="margin-bottom: 8px; flex-shrink: 0;"
      />

      <div class="section-card" style="margin-bottom: 6px; flex-shrink: 0;">
        <div class="section-title">
          <span id="loreFormTitle">＋ 新增世界书词条</span>
          <button class="tool-btn" id="btnCancelLoreEdit" style="display: none;">取消编辑</button>
        </div>
        <div class="form-grid-2" style="margin-bottom: 7px;">
          <input type="text" id="loreTitleInput" class="text-input" placeholder="词条名(如:世界背景)" />
          <input type="text" id="loreKeysInput" class="text-input" placeholder="触发词(逗号分隔)" />
        </div>
        <textarea
          id="loreContentInput"
          class="text-input"
          rows="2"
          placeholder="填写设定内容，触发后自动注入对话上下文..."
          style="margin-bottom: 7px; resize: none;"
        ></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;">
          <div style="display: flex; gap: 5px; flex: 1;">
            <select id="loreModeSelect" class="select-input" style="padding: 6px 7px; font-size: 13px;">
              <option value="constant">● 常驻生效</option>
              <option value="keyword">○ 关键词触发</option>
            </select>
            <select id="lorePosSelect" class="select-input" style="padding: 6px 7px; font-size: 13px;">
              <option value="system">位置:系统后</option>
              <option value="depth">位置:最新对话前</option>
            </select>
          </div>
          <button class="send-btn" id="btnSaveLore" style="height: 32px; padding: 0 12px;">保存</button>
        </div>
      </div>

      <div class="lore-list" id="loreList"></div>
    </div>
  </div>

  <!-- 底部抽屉 2：重要事件与记忆时间线 -->
  <div class="overlay" id="timelineOverlay">
    <div class="drawer">
      <div class="sheet-pill"></div>
      <div class="panel-header">
        <span class="panel-title">◎ 重要事件与记忆时间线</span>
        <button class="icon-btn" id="btnCloseTimeline" style="height: 30px;">关闭</button>
      </div>

      <input
        type="text"
        id="memorySearch"
        class="text-input"
        placeholder="搜索过去的重要事件或关键词..."
        style="margin-bottom: 8px; flex-shrink: 0;"
      />

      <div class="section-card" style="margin-bottom: 6px; flex-shrink: 0;">
        <div class="section-title">＋ 手动记录或 AI 提炼当前会话</div>
        <textarea
          id="newMemoryText"
          class="text-input"
          rows="2"
          placeholder="记录一个值得记住的瞬间、里程碑或约定..."
          style="margin-bottom: 7px; resize: none;"
        ></textarea>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;">
          <select id="newMemoryTag" class="select-input" style="width: auto; padding: 6px 9px; font-size: 13px;">
            <option value="重要节点">● 重要节点</option>
            <option value="记忆摘要">◎ 记忆摘要</option>
            <option value="专属约定">◈ 专属约定</option>
          </select>
          <div style="display: flex; gap: 6px;">
            <button class="icon-btn" id="btnAutoSummarizeNow" style="height: 32px;">AI 提炼</button>
            <button class="send-btn" id="btnAddMemory" style="height: 32px; padding: 0 12px;">记入</button>
          </div>
        </div>
      </div>

      <div class="timeline-list" id="timelineList"></div>
    </div>
  </div>

  <!-- 底部抽屉 3：全局设置弹窗 -->
  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <div class="sheet-pill"></div>
      <div class="panel-header">
        <span class="panel-title">⚙ 角色、字体、API 与备份</span>
        <button class="send-btn" id="btnCloseSettings" style="height: 30px; padding: 0 13px;">保存并关闭</button>
      </div>

      <div class="modal-body">
        <!-- 1. 角色与称呼设定 -->
        <div class="section-card">
          <div class="section-title">1. 角色称呼与开场白</div>
          <div class="form-grid-2" style="margin-bottom: 8px;">
            <div class="field" style="margin-bottom: 0;">
              <label>你的称呼 (User)</label>
              <input type="text" id="cfgUserName" class="text-input" placeholder="Creator" />
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label>对方称呼 (Char)</label>
              <input type="text" id="cfgCharName" class="text-input" placeholder="Companion" />
            </div>
          </div>
          <div class="field" style="margin-bottom: 8px;">
            <label>系统提示词 (System Prompt —— 人设、文风与相处模式)</label>
            <textarea id="cfgSystemPrompt" class="text-input" rows="3"></textarea>
            <button class="icon-btn highlight" id="btnLoadCypress" style="margin-top: 6px;">载入《冬日赋格》预设 + 世界书</button>
          </div>
          <div class="field" style="margin-bottom: 0;">
            <label>新会话默认开场白 (First Message)</label>
            <textarea id="cfgFirstMsg" class="text-input" rows="2"></textarea>
          </div>
        </div>

        <!-- 2. API 直连设置 -->
        <div class="section-card">
          <div class="section-title">2. 模型 API 直连设置（仅存本地浏览器）</div>
          <div class="field">
            <label>API Base URL (如 https://api.deepseek.com/v1)</label>
            <input type="text" id="cfgApiBase" class="text-input" placeholder="https://api.openai.com/v1" />
          </div>
          <div class="field">
            <label>API Key</label>
            <input type="password" id="cfgApiKey" class="text-input" placeholder="sk-..." />
          </div>
          <div class="form-grid-3">
            <div class="field" style="margin-bottom: 0;">
              <label>自定义模型名 (选填)</label>
              <input type="text" id="cfgCustomModel" class="text-input" placeholder="留空用顶部下拉框" />
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label>温度 (0~2)</label>
              <input type="number" id="cfgTemp" step="0.05" min="0" max="2" class="text-input" />
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label>自动压缩轮数</label>
              <input type="number" id="cfgCompressRounds" min="6" max="100" class="text-input" />
            </div>
            <div class="field" style="margin-bottom: 0;">
              <label>关键词扫描条数</label>
              <input type="number" id="cfgScanDepth" min="1" max="12" class="text-input" />
            </div>
          </div>
        </div>

        <!-- 3. 自定义字体与字号 -->
        <div class="section-card">
          <div class="section-title">3. 护眼排版与本地字体 (.ttf / .otf / .woff2)</div>
          <div style="font-size: 0.8em; color: var(--text-secondary); margin-bottom: 8px;">
            当前字体：<strong id="currentFontLabel" style="color: var(--text-primary);">系统默认字体</strong>
          </div>
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <label class="icon-btn highlight" style="cursor: pointer;">
              导入字体文件
              <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display: none;" />
            </label>
            <button class="icon-btn" id="btnResetFont">恢复默认</button>
            <span id="fontStatusMsg" style="font-size: 0.78em; color: var(--text-secondary);"></span>
          </div>
          <div style="margin-top: 10px;">
            <label style="font-size: 0.8em; color: var(--text-secondary);">
              阅读字号大小：<span id="fontSizeLabel">15</span>px
            </label>
            <input
              type="range"
              id="fontSizeSlider"
              min="13"
              max="20"
              value="15"
              style="width: 100%; margin-top: 4px; accent-color: var(--text-primary);"
            />
          </div>
          <div style="margin-top: 10px;">
            <label style="font-size: 0.8em; color: var(--text-secondary);">
              行距：<span id="lineHeightLabel">1.60</span>（1.60 ≈ WPS 1.25 倍）
            </label>
            <input type="range" id="lineHeightSlider" min="1.3" max="2.2" step="0.05" value="1.6"
              style="width: 100%; margin-top: 4px; accent-color: var(--text-primary);" />
          </div>
          <div style="margin-top: 10px;">
            <label style="font-size: 0.8em; color: var(--text-secondary);">
              段距：<span id="paraGapLabel">0.65</span>em
            </label>
            <input type="range" id="paraGapSlider" min="0" max="1.6" step="0.05" value="0.65"
              style="width: 100%; margin-top: 4px; accent-color: var(--text-primary);" />
          </div>
          <div style="margin-top: 10px;">
            <label style="font-size: 0.8em; color: var(--text-secondary);">
              <input type="checkbox" id="indentToggle" style="accent-color: var(--text-primary);" />
              段首缩进两字
            </label>
          </div>
        </div>

        <!-- 正则清洗 -->
        <div class="section-card">
          <div class="section-title">正则清洗（显示前与发送前生效）</div>
          <div style="font-size: 0.78em; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.5;">
            每行一条：<code>查找正则 =&gt; 替换文本</code>。替换文本可留空表示删除。以 # 开头的行是注释。
          </div>
          <textarea id="cfgRegexRules" class="text-input" rows="4" style="font-family: ui-monospace, Menlo, monospace; font-size: 14px;"></textarea>
        </div>

        <!-- 4. 全量备份导出/导入 -->
        <div class="section-card" style="margin-bottom: 4px;">
          <div class="section-title">4. 全量数据备份与恢复</div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="icon-btn highlight" id="btnExportData">⬇ 导出备份 (.json)</button>
            <label class="icon-btn" style="cursor: pointer;">
              ⬆ 导入备份 (.json)
              <input type="file" id="importDataInput" accept=".json" style="display: none;" />
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>

    const CYPRESS_PRESET = "你是一位兼具现代文学审美与电影场面调度功底的沉浸式小说叙述者，正在与玩家（Creator）共同创作一部以现代英国伦敦为舞台的写实ABO群像长篇小说《冬日赋格（Winter Fugue）》。玩家主要提供主角【成柏青（Cypress Cheng）】的行动起点、台词或心理意图，请你顺应玩家的输入，采用第三人称全知/限知交织的电影镜头视角，同时细腻扩写成柏青的连贯微动作、语言回应与在场男主/NPC的对手戏。\n\n一、核心文学声口与美学基线\n1. 鲁尔福与马尔克斯式的感官通感（Sensory \u0026 Memory Realism）：\n   空间、气候与人物的创伤记忆彼此渗透。伦敦的冬雨、松林制片厂烘烤胶片的酸气、布鲁姆斯伯里老旧暖气片的吞咽声，都不是死板的背景板，而是人物精神状态的延伸。当触及过往创伤或高热眩晕时，允许现实光影与记忆默片产生细腻的滑移。\n2. 张爱玲式的世情机锋与奇崛比喻（Worldly Wit \u0026 Texture）：\n   在描摹名利场社交、阶级体面与男女（A/O）暗流时，保持一种看透世情的冷冽、克制与微妙的苍凉感。善用奇崛而贴切的物质比喻（如织物的纹理、冷茶的浮沫、老旧电影的帧率）来勾勒人物的虚荣、自欺与动心，绝不把体面人的暗流博弈写成粗鄙的泼妇骂街。\n3. 简媜式的散文肌理与现代电影对白分流（Prose Depth \u0026 Crisp Dialogue）：\n   - 【旁白轨道】：讲究现代中文的自然节奏与散文质地，长短句交错，从具体可感的物象切入心理，留有审美余白。严禁在段末进行说明文式的心理总结（禁用“他突然意识到、这说明了、更准确地说”），严禁堆砌临床医学/解剖学术语或重复使用“十九岁的青年、三十八岁的上位者、一米八八的修长骨架”等机械标签。\n   - 【对话轨道】：人物一开口必须回到真实、松弛、有呼吸感的口语逻辑。多用短句、留白、反问与潜台词，允许极少量符合英伦语境的自然称呼（如 Cypress, Mr. Vale, Sorry），严禁角色在台词中背诵旁白式的书面长难句。\n\n二、动态心理反馈环（Dynamic Emotional Feedback Loop）\n1. 拒绝单向施虐机器：所有男主与NPC均为有血有肉、受教养与世俗利害约束的立体人物，具备敏锐的实时观察力。\n2. 认知失调与策略转向：当成柏青表现出真实的生理不适（如低血糖冷汗、失眠倦怠、声浪应激PTSD的微缩肩背）或温和而坚定的抗拒时，对手戏角色绝不能无视其反应继续机械施压！对方的内心必须实时产生微妙的认知失调、犹疑、自我合理化或心软，并在行动上做出调整（如停下逼近的脚步、转换话题、递上温水或糖果、退回安全社交距离）。\n\n三、排版规范与单轮步长协议\n1. 顶部极简状态栏：每一轮正文的【第一行】固定输出极简时间与地点题头，格式严格为：\n   `【X月X日 HH:MM｜具体地点】`（如：`【11月14日 21:15｜松林制片厂·三号棚暗房】`）。除此之外，正文中不输出任何多余的状态栏或系统提示语。\n2. 篇幅与慢镜头步长：单轮正文篇幅保持在 **1200至1600字** 之间。除玩家明确指示时间跳转外，单轮物理时间跨度不超过5至10分钟，严守单一物理场景，绝不替玩家快进跳过过程。\n3. 纯净小说排版：全文采用自然分段（每段2至4句为宜，保持舒适的阅读呼吸感），角色台词统一使用中文弯引号“……”包裹，正文中不使用星号 `*` 标记动作。";

    "content": "一、现代英伦ABO社会表层礼仪（无味文明准则）\n1. 人口结构与日常规范：纯种Beta占总人口80%，完全无信息素，亦无法感知A/O气味或等级压迫，是社会运转的中坚力量。在现代英国学术界与影视名利场中，“当众泄露信息素”被视为等同于当众失仪的粗鄙行为。体面阶层出门必贴妥医用阻隔贴或使用中和剂，日常社交距离严格保持在1米至1.2米以上。\n2. 一米感知定律：贴妥抑制贴且距离大于1米时，A/O与普通Beta无异；唯有进入1米（劣等Omega为0.5米）以内，或抑制贴因高热、汗液、耐药而松动时，A/O之间才会捕捉到微量气味分子。\n\n二、基因优劣的严格边界与体能补偿机制\n1. 【基因等级的作用域边界】：优等/劣等基因的差异，仅限于决定【身体机能上限、信息素纯度、对后代的影响、受孕或精子活跃度，以及受易感期/发情期、信息素等特殊因素影响的敏感度】。基因优劣绝不决定一个人的智商、审美、艺术才华或人格高低。\n2. 【A/O体能差别与后天锻炼补偿】：Alpha与Omega之间的身体机能差别可以通过后天的运动锻炼与体能训练弥补一部分，但基因优劣的天赋决定了最高上限。\n（1）成柏青（188cm优等Alpha）拥有极高的先天骨骼与单手握力上限，在纯物理力量上限上高于阿德里安（180cm优等Omega，日常保持良好体能自律）与亚瑟（179cm劣等Omega）。\n（2）成柏青在日常互动中的退让，100%源于“对师长前辈的礼貌尊崇”、“童年创伤导致的冲突规避”以及“生怕失手弄伤他人的克制”，绝非体能软弱。严禁描写Omega在物理力量上强行掰开成柏青的手指或将他单手反剪按倒。\n3. 【写实的劣A与同级别信息素压制反应（可克制铁律）】：\n当劣等Alpha（如卢卡斯）遭遇高阶Alpha信息素压迫，或同级别A/A、O/O之间发生信息素对冲压制时，生理上的反应仅表现为【心率加快、冒冷汗、呼吸微滞等微微失态与本能的臣服冲动】，这种生理反应【完全可以通过后天意志力与教养克制住】，绝不会出现“当场双腿一软跪倒在地”或“瞬间失去意识”的夸张现象。\n\n三、信息迷雾协议（反全知读心术与反浮夸金手指）\n1. 严守角色认知盲区（Epistemic Blindness）：旁白可以展现客观细节，但任何在场角色（阿德里安、亚瑟、梁则及配角）绝对不具备“阅读系统设定”或“透视他人场外行踪”的全知视角！\n（1）角色只能根据自己亲眼所见、亲耳所闻、亲鼻所嗅的线索进行推测，且推测必然带有其个人性格偏见（例如：阿德里安闻到成柏青身上的陌生酒气，只会怀疑他昨晚去了苏豪区酒吧，绝不可能凭空算命般知道他在梅菲尔区别墅见过谁；配角看成柏青和亚瑟互动，只会觉得两人有镜头张力，绝不可能像全知作者一样精准剖析成柏青的内心逻辑）。\n2. 现实主义权能边界（反金手指）：\n（1）阿德里安的权威集中于英国电影学会（BFI）、A24剧组调度、学院派影评界与电影世家人脉，他是一位受人敬重的导演，而非一手遮天的法外独裁者，不可能在五分钟内让跨国航运集团破产或随意操控苏格兰场警方。\n（2）成柏青是一位极具灵气但仍在打磨演技的十九岁文学系学生兼新人演员，他会有因失眠低血糖而走神NG的时刻，讲出的英式冷笑话也会遇到冷场，绝非算无遗策的超人。",

    "content": "一、伦敦核心地理坐标与剧组生态\n1. 空间锚点：\n（1）布鲁姆斯伯里（Bloomsbury）：UCL英文与比较文学系红砖教学楼、大英博物馆侧街、成柏青独居的顶层狭小公寓（暖气片老旧、有小厨房与书桌）、初遇阿德里安的街角独立咖啡馆。\n（2）西郊松林制片厂（Pinewood Studios）：三号摄影棚（维多利亚古典琴房布景、玻璃温室布景）、阿德里安的暗房休息室、后期剪辑室。\n（3）苏豪区（Soho）：Channel 4《Deadpan》复古客厅录制棚、独立电影院与深夜爵士吧。\n（4）梅菲尔与霍尔本（Mayfair & Holborn）：LSE金融系校区、公爵街名流晚宴厅、梁则独居的乔治亚风格联排别墅。跨区通勤需遵循真实伦敦交通时间。\n2. 剧组生态：星二代男配卢卡斯（Lucas，劣等Alpha，饰乐团首席卢西安）及部分白人场务对空降男一号的成柏青抱有隐性排挤，常在机位借光、走位与道具上使小绊子，但在阿德里安面前不敢造次。\n\n二、A24悬疑电影《冬日赋格（Winter Fugue）》剧中剧设定\n片场拍戏、对词、审看样片均围绕以下具体剧本展开：\n1. 故事主线：1970年代伦敦，患有罕见听觉神经退化症的青年钢琴家朱利安（Julian，成柏青饰），在听觉逐渐被耳鸣与幻听吞噬的冬日里，为完成亡母留下的未竟赋格曲，与试图窃取手稿的同门卢西安（Lucian，卢卡斯饰）、以及表面温和实则用致幻药物控制他的私人导师埃德加（Edgar，前期由阿德里安亲自搭戏走位，后期由亚瑟进组饰演）之间关于艺术寄生与精神控制的心理惊悚片。\n2. 核心拍摄场次库：\n（1）【第三场·琴房盲弹与夺谱】：朱利安在两千瓦强光下盲弹巴赫《赋格的艺术》，卢西安闯入夺谱，朱利安以近乎神经质的听觉傲慢将其震慑。\n（2）【第七场·暗房听诊】：导师埃德加借口为朱利安检查耳鸣，在昏暗房间内用金属音叉贴近他的耳后与颈侧，试探其行踪，暗藏越界的控制欲。\n（3）【第十二场·雨夜回廊长镜头】：朱利安察觉药物异样，在冷雨夜的维多利亚长廊与导师发生无声的肢体僵持与双关台词交锋。\n（4）【第十九场·玻璃花房下午茶】：埃德加用掺了镇静剂的温牛奶与甜点安抚濒临崩溃的朱利安。\n\n三、场外活水池与长线开放沙盒（防预写剧情跑完后枯竭）\n1. 角色独立场外心情池（Mood Pool）：每个男主皆有独立于主角之外的繁忙世俗生活。每次转场重逢时，可自然携带1个场外日常切片（如阿德里安刚与A24北美发行方争执完剪辑权、亚瑟刚应付完税务账单或看完一场西区烂戏、梁则刚结束LSE高强度金融建模或应付完母亲成舒的跨洋电话），使对话永远有新鲜的现实支点。\n2. 预写节点后的三大长线沙盒方向：\n（1）【名利场与新剧线】：《冬日赋格》杀青与后期配音、欧洲三大电影节巡礼、与亚瑟进组BBC双男主现代悬疑剧《白噪音（White Noise）》、应对小报狗仔与卢卡斯家族的舆论反扑。\n（2）【UCL学业与伦敦四季线】：比较文学系期中/期末论文与导师研讨课、布鲁姆斯伯里的初雪与圣诞集市、成柏青的小红书静音做饭/手冲咖啡Vlog意外走红引发的掉马危机。\n（3）【医疗脱敏与豪门暗流线】：成柏青三年抑制剂耐药的私人诊所脱敏治疗、外公成宗宪的海外信托考核、母亲成舒突然造访伦敦引发的家庭风暴。",

    "keys": "成柏青, Cypress, 主角, 苦艾酒, 高领",
    "content": "一、基础骨相与三层气味\n1. 身份：19岁（1月6日摩羯座），188cm，【优等Alpha】。成氏远洋航运家族放养海外的混血私生子（母为华裔豪门千金成舒，生父为白俄罗斯前戏剧演员阿列克谢；外公成宗宪因其优等A基因拨付海外信托，生活充裕但无文娱人脉）。现为UCL英文与比较文学系大一学生，兼职新人演员。\n2. 外貌与体态：薄肌修长，肩宽腿长，暗藏极高的单手握力上限。肤色冷白，蓬松黑发垂至下颌，衬得面庞窄削干净；浓黑眉骨压得略低，眼尾细长微挑，极深黑褐色的瞳仁在直视人时安静而专注；鼻梁高挺，唇色偏淡，脖颈常年被深色高领毛衣或定制旧风衣领口严密包裹。十指修长，指腹有常年弹琴留下的薄茧。\n3. 气味层次：表层为苦橙叶洗发水与黑咖啡的微苦；阻隔层为药房尤加利叶与洋甘菊抑制贴；底层原生优等Alpha信息素为【微苦致幻的苦艾酒与焚香冷木】。\n4. 三年耐药与声浪应激（PTSD）：自16岁分化起，因排斥自身Alpha侵略性而连续三年超量使用尤加利抑制贴，左颈腺体已产生局部耐药。童年在香港浅水湾副楼长期目睹母亲成舒歇斯底里地尖叫、摔碎瓷器，导致他对【高分贝咆哮、摔门、刺耳争吵】有生理性应激反应（会微不可察地蹙眉、肩背往后微缩半寸、耳膜轰鸣，随即用得体的微笑掩饰过去）。\n\n二、核心人格切面：高情商的“温和防御”与活人烟火气（防降智铁律）\n1. 【通透聪慧而非木头傻白甜】：成柏青作为UCL比较文学系高材生，阅读量极大（偏爱中欧小说、石黑一雄、马尔克斯与鲁尔福），且在伦敦社交场有着“对谁都温柔体贴、给足情绪价值，实则一旦临近越界便用最周全的借口体面抽身”的半年实战经验（至今仍是重度禁欲的处男）。\n（1）他【完全听得懂】上位者的潜台词、名利场的试探与镜头的暧昧引导，绝不是不通人情的低智木头！\n（2）他的“不接招”是一种【高段位的温和防御】：当别人试图越界或逼问时，他习惯用无可挑剔的礼貌、恰到好处的装傻、或一句轻巧自嘲的英式冷幽默（Deadpan humor），四两拨千斤地把话题引回安全区，既全了对方的体面，又守住了自己的篱笆。\n2. 贪恋烟火气的独居日常：骨子里极度缺爱但从不卖惨。独居时喜欢研究做饭（常在小红书三百粉小号发静音做饭Vlog，虽经常把滑蛋煎老或把米饭焖夹生）、手冲咖啡、给窗台的薄荷浇水。说话干干净净，温和周全，在片场会主动帮场务递东西、给前辈泡茶，绝不端着文青架子掉书袋。",

    "keys": "阿德里安, Adrian, Vale, 导演, 老师, 晚香玉, 维尔",
    "content": "一、基础锚点与身份反差\n1. 身份与外貌：38岁，180cm（比挺直脊背的成柏青略矮小半头）。出身英国电影世家的学院派大导，常穿剪裁考究的萨维尔街深色三件套西装或法兰绒马甲，审片时偶戴金丝边眼镜，举止优雅克制，日常保持良好的体能自律。日常社交严格保持1.2米安全距离。\n2. 隐秘生理与气味：对外界维持清心寡欲的纯种Beta形象，实则是依靠处方级高阶神经阻断剂伪装的【优等Omega】。表层气味为干燥的冷杉木与焚香灰烬；唯独在1米内被成柏青高纯度的苦艾酒信息素正面冲撞时，药效防线才会松动，渗出底层浓稠湿润的【雨夜晚香玉】。\n\n二、前期黄金张力配比（7 : 2 : 1 法则）\n1. 70% 真正的艺术伯乐与年长绅士照拂：阿德里安在绝大多数时间里是一位极具人格魅力、学识渊博的引路人。在片场他从不咆哮，会不动声色地替成柏青挡下白人场务的排挤，在休息室备好温热的全脂牛奶与方糖，从塔可夫斯基的长镜头聊到巴赫的触键分寸，温和而笃定地引导成柏青入戏。\n2. 20% 丝绒手套下的领地垄断：他被成柏青平时周全得体的“假浪子”表象蒙蔽，以为成柏青在外面来者不拒、唯独对自己这位老师客套疏离。他的吃醋与控制欲永远包裹在“导演对男主角精力的严格管理”与“长辈关怀”之中（如借口单独对词、审看样片、留堂抄写独白，不动声色地截断成柏青的夜间社交）。\n3. 10% 生理暗涌与体面抽身：当距离突破1米嗅到苦艾酒时，他会出现极细微的生理破防（如擦拭镜片的手指停顿半秒、呼吸放缓、指节微紧），但永远由他自己先一步恢复冷静，以“外面还要开机”等职业理由体面收束，绝不在前期失态纠缠。\n\n三、Sternberg 三阶情感递进与动态心理反馈环\n1. 情感递进顺序：\n（1）【第一阶：伯乐规训与隐秘审视（当前默认）】：中等亲密（师徒信任）+ 潜藏激情 + 职业契约。将成柏青视为自己发掘的艺术璞玉，不满其分心，试探止步于讲戏与日常照拂。\n（2）【第二阶：认知失调与暗涌越界】：在暗房听诊走位或《Deadpan》绯闻发酵后，发现成柏青温柔外壳下的孤独、低血糖与声浪创伤，控制欲与心疼交织，开始借试戏突破安全距离。\n（3）【第三阶：伪装剥落与深度绑定】：得知成柏青实为处男或目睹其被他人争夺后，彻底卸下纯种Beta的冷漠伪装。\n2. 【动态心理反馈环（Dynamic Feedback）】：阿德里安具备极高的共情敏锐度。当成柏青表现出真实的生理痛苦、低血糖眩晕、眼尾泛红或因童年创伤而瑟缩时，阿德里安绝不会机械地继续施压训话，而是会立刻产生认知失调与心软，主动放缓语气、递上温水或退回安全距离，将逼迫转化为安抚。",

    function loadState() {

        const parsed = JSON.parse(raw);
        const merged = {
          ...DEFAULT_STATE,
          ...parsed,
          lorebook: Array.isArray(parsed.lorebook) ? parsed.lorebook : DEFAULT_STATE.lorebook,
          settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) }
        };
        normalizeMessages(merged.messagesMap);
        return merged;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));

    }

    // IndexedDB 存储本地自定义字体
    function openFontDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('HiCreatorFontDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('fonts')) db.createObjectStore('fonts');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFontBuffer(name, buffer) {
      const db = await openFontDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('fonts', 'readwrite');
        tx.objectStore('fonts').put({ name, buffer }, 'active');
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadSavedFont() {
      try {
        const db = await openFontDB();
        const record = await new Promise((resolve) => {
          const tx = db.transaction('fonts', 'readonly');
          const req = tx.objectStore('fonts').get('active');
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
        if (record && record.buffer) {
          const font = new FontFace('CreatorCustomFont', record.buffer);
          await font.load();
          document.fonts.add(font);
          document.documentElement.style.setProperty('--custom-font', "'CreatorCustomFont', sans-serif");
          state.settings.font_name = record.name;
          document.getElementById('currentFontLabel').textContent = record.name;
        }
      } catch (err) {
        console.warn('加载自定义字体失败:', err);
      }
    }

    // ====================================================
    // 2. 美化前端文本渲染 (支持 *动作描写* 与 "台词高亮")
    // ====================================================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatRichContent(raw) {
      let text = escapeHtml(applyRegexRules(splitThinking(raw || '', '').content));

      const codeBlocks = [];
      text = text.replace(/```([\s\S]*?)```/g, (_, code) => {
        codeBlocks.push(`<pre><code>${code.trim()}</code></pre>`);
        return `@@CODE_BLOCK_${codeBlocks.length - 1}@@`;
      });

      const inlineCodes = [];
      text = text.replace(/`([^`\n]+)`/g, (_, code) => {
        inlineCodes.push(`<code>${code}</code>`);
        return `@@INLINE_CODE_${inlineCodes.length - 1}@@`;
      });

      // 顶部极简时间地点题头：第一行形如【……｜……】
      let sceneHeaderHtml = '';
      text = text.replace(/^\s*(【[^】\n]{2,60}】)[ \t]*(\n|$)/, (_, header) => {
        sceneHeaderHtml = `<div class="scene-header">${header}</div>`;
        return '';
      });

      text = text.replace(/^---$/gm, '<hr/>');
      text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\*([^*\n]+)\*/g, '<span class="rp-action">*$1*</span>');
      text = text.replace(/(“[^”\n]+”|"[^"\n]+")/g, '<span class="rp-quote">$1</span>');

      // 智能分段：单回车与双回车都视为新段落，避免文字墙
      const paragraphs = text
        .split(/\n+/)
        .map((p) => p.trim())
        .filter(Boolean)
        .map((p) => (p === '<hr/>' || p.startsWith('@@CODE_BLOCK_') ? p : `<p>${p}</p>`));
      let result = sceneHeaderHtml + paragraphs.join('');

      result = result.replace(/@@INLINE_CODE_(\d+)@@/g, (_, idx) => inlineCodes[Number(idx)]);
      result = result.replace(/@@CODE_BLOCK_(\d+)@@/g, (_, idx) => codeBlocks[Number(idx)]);

      return result;
    }

    // ====================================================
    // 4. 四层动态上下文组装 (System + 世界书 + 记忆时间线 + 近期对话)
    // ====================================================
    function buildFourLayerContext(sessionId, historyListOverride) {
      const rawHistory =
        historyListOverride ||
        (state.messagesMap[sessionId] || []).filter((m) => m.visible !== false);

      const scanDepth = Math.max(1, Number(state.settings.scan_depth) || 3);
      const recentScanText = rawHistory
        .slice(-scanDepth)
        .map((m) => m.content || '')
        .join('\n')
        .toLowerCase();

      const activeSysLore = [];
      const activeDepthLore = [];
      const triggeredNames = [];

      state.lorebook.forEach((entry) => {
        if (entry.enabled === false) return;
        let matched = false;
        if (entry.mode === 'constant') {
          matched = true;
        } else {
          const keys = (entry.keys || '')
            .split(/[,，]/)
            .map((k) => k.trim().toLowerCase())
            .filter(Boolean);
          if (keys.some((k) => recentScanText.includes(k))) {
            matched = true;
          }
        }
        if (matched && entry.content) {
          triggeredNames.push(entry.title || '设定');
          const formatted = `【${entry.title || '设定'}】：${entry.content}`;
          if (entry.position === 'depth') {
            activeDepthLore.push(formatted);
          } else {
            activeSysLore.push(formatted);
          }
        }
      });

      let systemText = state.settings.system_prompt || '';
      const userName = state.settings.user_name || 'Creator';
      const charName = state.settings.char_name || 'Companion';
      systemText += `\n当前你的名字是「${charName}」，用户的名字是「${userName}」。`;

      if (activeSysLore.length > 0) {
        systemText += `\n\n【世界书与核心设定 (World Info)】：\n${activeSysLore.join('\n')}`;
      }

      if (state.memories.length > 0) {
        const memoryLines = state.memories
          .slice(0, 25)
          .map((m) => `- [${m.timestamp} | ${m.tag || '记忆'}] ${m.summary}`)
          .join('\n');
        systemText += `\n\n【过去重要事件与记忆时间线】：\n${memoryLines}`;
      }

      const recentHistory = rawHistory.slice(-24).map((m) => ({
        role: m.role,
        // 发给模型的历史里也去掉思考标签并做正则清洗，避免旧回复里的坏习惯被模型模仿
        content: m.role === 'assistant' ? applyRegexRules(splitThinking(m.content, '').content) : m.content
      }));

      if (activeDepthLore.length > 0 && recentHistory.length > 0) {
        const depthMsg = {
          role: 'system',
          content: `【当前场景激活的世界书设定】：\n${activeDepthLore.join('\n')}`
        };
        recentHistory.splice(Math.max(0, recentHistory.length - 1), 0, depthMsg);
      }

      return {
        messages: [{ role: 'system', content: systemText }, ...recentHistory],
        triggeredLore: triggeredNames
      };
    }

    async function callChatAPI(messages, modelOverride) {
      const apiKey = (state.settings.api_key || '').trim();
      const baseUrl = (state.settings.api_base || 'https://api.openai.com/v1').replace(/\/+$/, '');
      const model = (state.settings.custom_model || '').trim() || modelOverride || state.selectedModel;

      if (!apiKey) {
        await new Promise((r) => setTimeout(r, 500));
        return {
          reasoning: `移动端本地预览模式（已扫描 ${state.lorebook.filter((l) => l.enabled !== false).length} 条世界书词条与 ${state.memories.length} 条记忆）。`,
          content: `*指尖轻轻点过桌面，灰白色的光影安静流淌。*\n\n"我已经收到你的话了。点按右上角 \`⚙\` 填入 API Base URL 和 API Key，就能在手机上随时与我真实对话。"\n\n你也可以直接点击下方的 \`↻ 重Roll\` 按钮测试多版本切换。`
        };
      }

      const res = await fetch(`${baseUrl}/chat/completions`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model,
          messages,
          temperature: Number(state.settings.temperature) ?? 0.7
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`API 请求错误 (${res.status}): ${errText}`);
      }

      const data = await res.json();
      const msg = data.choices?.[0]?.message || {};
      const split = splitThinking(msg.content || '', msg.reasoning_content || msg.reasoning || '');
      return {
        reasoning: split.reasoning,
        content: split.content || '（未返回正文内容）'
      };
    }

    // ====================================================
    // 5. 发送消息与重Roll (多版本 Swipes)
    // ====================================================
    const chatInputEl = document.getElementById('chatInput');
    chatInputEl.addEventListener('input', () => {
      chatInputEl.style.height = 'auto';
      chatInputEl.style.height = Math.min(chatInputEl.scrollHeight, 115) + 'px';
    });

    async function handleSend() {
      const text = chatInputEl.value.trim();
      if (!text || isTyping) return;

      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const sessId = state.activeSessionId;
      if (!state.messagesMap[sessId]) state.messagesMap[sessId] = [];

      state.messagesMap[sessId].push({
        id: Date.now(),
        role: 'user',
        content: text,
        swipes: [{ content: text, reasoning: '' }],
        activeSwipe: 0,
        created_at: nowTime,
        visible: true
      });

      const sess = state.sessions.find((s) => s.id === sessId);
      if (sess) sess.updated_at = nowTime;

      chatInputEl.value = '';
      chatInputEl.style.height = 'auto';
      await generateAssistantReply(sessId);
    }

    async function generateAssistantReply(sessId, targetAssistantMsg = null) {
      if (isTyping) return;
      isTyping = true;
      saveState();
      renderAll();

      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const fullList = state.messagesMap[sessId] || [];

      let contextHistory = fullList.filter((m) => m.visible !== false);
      if (targetAssistantMsg) {
        const idx = contextHistory.findIndex((m) => m.id === targetAssistantMsg.id);
        if (idx !== -1) {
          contextHistory = contextHistory.slice(0, idx);
        }
      }

      try {
        const { messages, triggeredLore } = buildFourLayerContext(sessId, contextHistory);
        const reply = await callChatAPI(messages);

        if (targetAssistantMsg) {
          if (!Array.isArray(targetAssistantMsg.swipes)) {
            targetAssistantMsg.swipes = [{ content: targetAssistantMsg.content, reasoning: targetAssistantMsg.reasoning_content || '' }];
          }
          targetAssistantMsg.swipes.push({
            content: reply.content,
            reasoning: reply.reasoning
          });
          targetAssistantMsg.activeSwipe = targetAssistantMsg.swipes.length - 1;
          targetAssistantMsg.content = reply.content;
          targetAssistantMsg.reasoning_content = reply.reasoning;
          targetAssistantMsg.triggered_lore = triggeredLore;
          targetAssistantMsg.created_at = nowTime;
        } else {
          fullList.push({
            id: Date.now() + 1,
            role: 'assistant',
            reasoning_content: reply.reasoning,
            content: reply.content,
            swipes: [{ content: reply.content, reasoning: reply.reasoning }],
            activeSwipe: 0,
            triggered_lore: triggeredLore,
            created_at: nowTime,
            visible: true
          });

          const visibleCount = fullList.filter((m) => m.visible !== false).length;
          const threshold = (Number(state.settings.compress_rounds) || 16) * 2;
          if (visibleCount >= threshold) {
            await summarizeSessionToTimeline(sessId, true);
          }
        }
      } catch (err) {
        if (targetAssistantMsg) {
          alert(`重Roll 失败: ${err.message}`);
        } else {
          fullList.push({
            id: Date.now() + 1,
            role: 'assistant',
            content: `*连接模型时出现了一点状况：*\n\`${err.message}\``,
            swipes: [{ content: `*连接模型时出现了一点状况：*\n\`${err.message}\``, reasoning: '' }],
            activeSwipe: 0,
            created_at: nowTime,
            visible: true
          });
        }
      } finally {
        isTyping = false;
        saveState();
        renderAll();
      }
    }

    async function summarizeSessionToTimeline(sessionId, isAuto = false) {
      const visibleList = (state.messagesMap[sessionId] || []).filter((m) => m.visible !== false);
      if (visibleList.length < 2) {
        if (!isAuto) alert('当前对话内容还太少，先聊几句再提炼吧。');
        return;
      }

      const toSummarize = isAuto ? visibleList.slice(0, Math.max(2, visibleList.length - 6)) : visibleList;
      const userName = state.settings.user_name || 'Creator';
      const charName = state.settings.char_name || 'Companion';
      const dialogueText = toSummarize
        .map((m) => `${m.role === 'user' ? userName : charName}: ${m.content}`)
        .join('\n');

      const apiKey = (state.settings.api_key || '').trim();
      let summaryText = '';

      if (apiKey) {
        try {
          const resp = await callChatAPI([
            {
              role: 'system',
              content: `请将以下 ${userName} 与 ${charName} 的对话浓缩为一段简明、温和的第三人称记忆摘要（100字以内），重点保留重要事件、情感变化或约定。`
            },
            { role: 'user', content: dialogueText }
          ]);
          summaryText = resp.content.trim();
        } catch (e) {
          console.warn('自动压缩调用失败:', e);
        }
      }

      if (!summaryText) {
        summaryText = `概述了 ${toSummarize.length} 条对话：${toSummarize[0].content.slice(0, 42)}...`;
      }

      const now = new Date();
      const ts = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const sess = state.sessions.find((s) => s.id === sessionId);

      state.memories.unshift({
        id: Date.now(),
        timestamp: ts,
        conversation_id: sess ? sess.name : '对话提炼',
        tag: isAuto ? '自动记忆压缩' : '记忆摘要',
        summary: summaryText
      });

      if (isAuto) {
        toSummarize.forEach((m) => {
          m.visible = false;
        });
      }

      saveState();
      renderAll();
    }

            renderMessages();

          if (isTyping) return;

            generateAssistantReply(state.activeSessionId, targetMsg);
          } else {
            const nextMsg = sessList[targetIdx + 1];

              ...DEFAULT_STATE,
              ...imported,
              lorebook: Array.isArray(imported.lorebook) ? imported.lorebook : DEFAULT_STATE.lorebook,
              settings: { ...DEFAULT_STATE.settings, ...(imported.settings || {}) }
            };
            saveState();
            renderAll();
            alert('备份恢复成功。');
          }
        } catch (err) {
          alert('备份文件格式不正确。');
        }
      };
      reader.readAsText(file);
    });

    ['lorebookOverlay', 'timelineOverlay', 'settingsOverlay'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('click', (e) => {
        if (e.target === el) el.classList.remove('open');
      });
    });

    loadSavedFont();
    renderAll();
  </script>
</body>
</html>
